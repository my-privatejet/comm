<body>

<script>







/*



==================================================



중요



==================================================







이 프로그램은 다음 브라우저 저장 기능을 전혀 사용하지 않습니다.







localStorage



sessionStorage



IndexedDB







실제 데이터는 오직







account_book.json







파일에만 저장됩니다.







페이지를 열면 Edge Function을 통해 서버 데이터를 자동으로 불러옵니다.



*/











const DEFAULT_NAMES = [



    "김용환",



    "이화랑",



    "이강산"



];











/*



==================================================



메모리에 잠시 들고 있는 데이터







페이지 종료 시 사라집니다.



실제 영구 데이터는 Supabase account_book 테이블의 id=1 행 data(jsonb)에 저장됩니다.



==================================================



*/







const API_URL = "https://zqmxdgktmxbvbsbcmulp.supabase.co/functions/v1/account-book";

let accountSecret = "";

let accountData = {



    names: [],



    income: [],



    expense: []



};

let incomeStatus = "미입금";



let editingId = null;



let viewPeriod = "day";



let weekBaseDate = new Date();











/*



==================================================



시작



==================================================



*/







document.addEventListener("DOMContentLoaded", async function() {

    const today = getToday();

    document.getElementById("incomeDate").value = today;

    document.getElementById("dayDate").value = today;

    document.getElementById("monthDate").value = today.substring(0, 7);

    weekBaseDate = parseDate(today);

    document.getElementById("incomeType").addEventListener("change", updateIncomeTypeState);

    const loaded = await loadAccountData();

    if (!loaded) return;

    renderNameSelects();

    updateIncomeTypeState();

    updateFilterTypeState();

    updateWeekDisplay();

    refreshView();

});



/*

==================================================

Edge Function 연결

==================================================

*/

async function requestAccountSecret() {
    if (accountSecret) return true;
    const result = prompt("가계부 비밀번호를 입력해주세요.");
    if (result === null || !result.trim()) return false;
    accountSecret = result.trim();
    return true;
}

async function loadAccountData() {
    try {
        if (!await requestAccountSecret()) return false;
        const response = await fetch(API_URL, {
            method: "GET",
            headers: {
                "x-account-secret": accountSecret
            }
        });
        if (response.status === 401) {
            accountSecret = "";
            alert("비밀번호가 올바르지 않습니다.");
            return false;
        }
        if (!response.ok) {
            const text = await response.text();
            throw new Error("서버 오류: " + response.status + "\n" + text);
        }
        const data = await response.json();
        accountData = normalizeAccountData(data);
        return true;
    } catch (error) {
        console.error("가계부 불러오기 오류:", error);
        alert("가계부 데이터를 불러오지 못했습니다.\n\n" + error.message);
        return false;
    }
}

/*



==================================================



데이터 구조 보정



==================================================



*/







function normalizeAccountData(data) {







    if (!data || typeof data !== "object") {



        data = {};



    }







    if (!Array.isArray(data.names)) {



        data.names = [];



    }







    if (!Array.isArray(data.income)) {



        data.income = [];



    }







    if (!Array.isArray(data.expense)) {



        data.expense = [];



    }











    data.names = data.names



        .filter(name => typeof name === "string")



        .map(name => name.trim())



        .filter(name => name !== "");











    data.income = data.income.map(function(item) {







        return {



            id: String(item.id || createId()),



            date: item.date || "",



            type: item.type || "",



            community: item.community || "",



            name: item.name || "",



            amount: Number(item.amount || 0),



            status: item.status || "입금완료"



        };







    });











    return data;







}











/*



==================================================



고유 ID



==================================================



*/







function createId() {







    return (



        Date.now().toString() +



        "_" +



        Math.floor(



            Math.random() * 1000000



        ).toString()



    );







}











/*

==================================================

Supabase 저장

==================================================

*/

async function writeAccountJson() {
    try {
        if (!await requestAccountSecret()) return false;
        accountData = normalizeAccountData(accountData);
        const response = await fetch(API_URL, {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "x-account-secret": accountSecret
            },
            body: JSON.stringify(accountData)
        });
        if (response.status === 401) {
            accountSecret = "";
            alert("비밀번호가 올바르지 않습니다.");
            return false;
        }
        if (!response.ok) {
            const text = await response.text();
            throw new Error("서버 오류: " + response.status + "\n" + text);
        }
        return true;
    } catch (error) {
        console.error("가계부 저장 오류:", error);
        alert("가계부 저장에 실패했습니다.\n\n" + error.message);
        return false;
    }
}

/*



==================================================



이름 Select



==================================================



*/







function renderNameSelects() {







    const incomeSelect =



        document.getElementById(



            "incomeName"



        );











    const filterSelect =



        document.getElementById(



            "filterName"



        );











    const selectedIncomeName =



        incomeSelect.value;











    const selectedFilterName =



        filterSelect.value;











    incomeSelect.innerHTML =



        "";











    filterSelect.innerHTML =



        '<option value="">전체</option>';











    for (



        const name



        of accountData.names



    ) {







        incomeSelect.add(



            new Option(



                name,



                name



            )



        );











        filterSelect.add(



            new Option(



                name,



                name



            )



        );







    }











    if (



        accountData.names.includes(



            selectedIncomeName



        )



    ) {







        incomeSelect.value =



            selectedIncomeName;







    }











    if (



        accountData.names.includes(



            selectedFilterName



        )



    ) {







        filterSelect.value =



            selectedFilterName;







    }







}











/*



==================================================



이름 모달



==================================================



*/







function openNameModal() {











    renderNameManageList();











    document



        .getElementById("nameModal")



        .classList.add("show");







}











function closeNameModal() {







    document



        .getElementById("nameModal")



        .classList.remove("show");







}











function modalBackgroundClick(event) {







    if (



        event.target.id ===



        "nameModal"



    ) {







        closeNameModal();







    }







}











/*



==================================================



이름 목록



==================================================



*/







function renderNameManageList() {







    const box =



        document.getElementById(



            "nameManageList"



        );











    box.innerHTML =



        "";











    if (



        accountData.names.length === 0



    ) {







        box.innerHTML =



            '<div class="empty">등록된 이름이 없습니다.</div>';







        return;







    }











    accountData.names.forEach(



        function(name, index) {







            const row =



                document.createElement(



                    "div"



                );











            row.className =



                "name-manage-item";











            row.innerHTML =



                `



                <div class="name-text">



                    ${escapeHtml(name)}



                </div>







                <button



                    class="btn btn-gray"



                    onclick="editName(${index})"



                >



                    수정



                </button>







                <button



                    class="btn btn-red"



                    onclick="deleteName(${index})"



                >



                    삭제



                </button>



                `;











            box.appendChild(



                row



            );







        }



    );







}











/*



==================================================



이름 추가



==================================================



*/







async function addName() {











    const input =



        document.getElementById(



            "newNameInput"



        );











    const name =



        input.value.trim();











    if (!name) {







        alert(



            "이름을 입력해주세요."



        );







        return;







    }











    if (



        accountData.names.includes(



            name



        )



    ) {







        alert(



            "이미 등록된 이름입니다."



        );







        return;







    }











    /*



    실패 시 되돌리기 위해 복사



    */







    const oldNames =



        [...accountData.names];











    accountData.names.push(



        name



    );











    const saved =



        await writeAccountJson();











    if (!saved) {







        accountData.names =



            oldNames;







        return;







    }











    input.value =



        "";











    renderNameSelects();



    renderNameManageList();











    document.getElementById(



        "incomeName"



    ).value =



        name;











    refreshView();







}











/*



==================================================



이름 수정







기존 수익 내역의 이름도 같이 수정



==================================================



*/







async function editName(index) {











    const oldName =



        accountData.names[



            index



        ];











    const result =



        prompt(



            "이름을 수정해주세요.",



            oldName



        );











    if (result === null) {



        return;



    }











    const newName =



        result.trim();











    if (!newName) {







        alert(



            "이름을 입력해주세요."



        );







        return;







    }











    if (



        newName !== oldName &&



        accountData.names.includes(



            newName



        )



    ) {







        alert(



            "이미 등록된 이름입니다."



        );







        return;







    }











    /*



    저장 실패 대비



    */







    const backup =



        JSON.stringify(



            accountData



        );











    accountData.names[



        index



    ] =



        newName;











    /*



    기존 수익 기록도 이름 변경



    */







    accountData.income.forEach(



        function(item) {







            if (



                item.name ===



                oldName



            ) {







                item.name =



                    newName;







            }







        }



    );











    const saved =



        await writeAccountJson();











    if (!saved) {







        accountData =



            JSON.parse(



                backup



            );







        return;

            parseDate(

                    "dayDate"

        return {



            start: date,

    }

            weekBaseDate

    }











    const value =

        year,



        month



    ] =

            Number



        );











    return {







        start:



            new Date(

                month - 1,

        end:

                month,



                0

/*



==================================================



주 범위



월요일 ~ 일요일



==================================================



*/







function getWeekRange(baseDate) {







    const date =



        new Date(



            baseDate



        );











    let day =



        date.getDay();











    if (



        day === 0



    ) {







        day =



            7;







    }











    const start =



        new Date(



            date



        );











    start.setDate(



        date.getDate() -



        day +



        1



    );











    const end =



        new Date(



            start



        );











    end.setDate(



        start.getDate() +



        6



    );











    return {



        start: start,



        end: end



    };







}

        }

    }

        ).sort();

    ) {

            dateGroups[

        }

    }











    if (

엑셀 파일명

function getExcelFileName(start, end) {







    if (



        viewPeriod ===



        "day"



    ) {







        return (



            "수익_" +



            start +



            ".xlsx"



        );







    }











    if (



        viewPeriod ===



        "week"



    ) {







        return (



            "수익_" +



            start +



            "_" +



            end +



            ".xlsx"



        );







    }











    return (



        "수익_" +



        start.substring(



            0,



            7



        ) +



        ".xlsx"



    );







}











function getPeriodName() {







    if (



        viewPeriod ===



        "day"



    ) {







        return "일";







    }











    if (



        viewPeriod ===



        "week"



    ) {







        return "주";







    }











    return "달";







}











/*



==================================================



날짜



==================================================



*/







function getToday() {







    return formatDate(



        new Date()



    );







}











function parseDate(value) {







    if (!value) {







        return new Date();







    }











    const parts =



        value.split("-");











    return new Date(







        Number(



            parts[0]



        ),







        Number(



            parts[1]



        ) - 1,







        Number(



            parts[2]



        )







    );







}











function formatDate(date) {







    const year =



        date.getFullYear();











    const month =



        String(



            date.getMonth() + 1



        ).padStart(



            2,



            "0"



        );











    const day =



        String(



            date.getDate()



        ).padStart(



            2,



            "0"



        );











    return (



        year +



        "-" +



        month +



        "-" +



        day



    );







}











/*



==================================================



금액



==================================================



*/







function formatMoney(amount) {







    return (



        Number(



            amount ||



            0



        ).toLocaleString(



            "ko-KR"



        ) +



        "원"



    );







}











/*



==================================================



HTML Escape



==================================================



*/







function escapeHtml(text) {







    const div =



        document.createElement(



            "div"



        );











    div.textContent =



        text ??



        "";











    return div.innerHTML;







}
